<!-- Modal Adicionar Conta -->
<div class="modal sollus-modal fade" id="modalAdicionarConta" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form method="post" action="{{ url_for('financeiro_bp.contas_receber_adicionar') }}">
        <div class="modal-header">
          <h5 class="modal-title">Adicionar conta a receber</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">CNPJ</label>
              <input type="text" class="form-control" id="cadastro-cnpj" name="cnpj" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Cliente</label>
              <input type="text" class="form-control" id="cadastro-cliente" name="cliente" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contrato</label>
              <input type="text" class="form-control" name="contrato" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" name="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Software</label>
              <select class="form-select" name="software" required>
                <option value="">Selecione um software</option>
                <option value="VELTI PONTO">VELTI PONTO</option>
                <option value="HENR PONTO">HENR PONTO</option>
                <option value="RHID">RHID</option>
                <option value="Secullum Acesso">Secullum Acesso</option>
                <option value="Secullum Ponto">Secullum Ponto</option>
                <option value="Smart Control">SmartControl</option>
                <option value="STPWIN">STPWIN</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Data da pendência</label>
              <input type="date" class="form-control" name="data_primeira_pendencia" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Valor</label>
              <input type="text" class="form-control" name="valor" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Empresa responsável</label>
              <select class="form-select" name="empresa_responsavel" required>
                <option value="">Selecione uma empresa</option>
                <option value="Sollus Tecnologia">Sollus Tecnologia</option>
                <option value="Technosollus RJ">Technosollus RJ</option>
                <option value="Sollus Campos">Sollus Campos</option>
                <option value="Technosollus ES">Technosollus ES</option>
                <option value="Sollus SP">Sollus SP</option>
                <option value="Sollus PR">Sollus PR</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Adicionar</button>
        </div>
      </form>
    </div>
  </div>
</div>
