<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}?v=3">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v=3">
  <style>
    body{font-family:Arial, sans-serif;color:#0f172a;margin:24px;}
    h1{font-size:20px;margin:0 0 6px;}
    p{font-size:12px;color:#475569;margin:0 0 16px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{border:1px solid #cbd5f5;padding:6px;text-align:left;}
    th{background:#0b3b8c;color:#fff;}
    tfoot td{font-weight:700;}
  </style>
</head>
<body>
  <h1>Informações do Trimestre</h1>
  <p>Gerado em {{ generated_at }}</p>
  <table>
    <thead>
      <tr>
        <th>Mês</th>
        <th>Valor faturado</th>
        <th>Valor recebido</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td>{{ row.Nome_mes }}</td>
        <td>R$ {{ row.Valor_faturado_display }}</td>
        <td>R$ {{ row.Valor_recebido_display }}</td>
      </tr>
      {% endfor %}
    </tbody>
    <tfoot>
      <tr>
        <td>Total trimestral</td>
        <td>R$ {{ total_faturado }}</td>
        <td>R$ {{ total_recebido }}</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
